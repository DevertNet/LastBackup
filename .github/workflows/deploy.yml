name: deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy auf cloud.einfach123.de
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          echo "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # Der Key ist serverseitig fest an "deploy.sh lastbackup.devert.net" gebunden.
          ssh -i ~/.ssh/id_deploy deploy@cloud.einfach123.de
